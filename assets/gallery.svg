<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1784" height="1600" viewBox="0 0 1784 1600">
  <!-- Gallery: Browse all 28 looks expanded. Real DP-2 capture (3840x1600, scale 1.6); the panel sits at its real position, bullets in the free space. -->
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#070a14" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#070a14" stop-opacity="0.84"/>
      <stop offset="0.64" stop-color="#070a14" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#070a14" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-10%" width="140%" height="125%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <image x="0" y="0" width="1784" height="1600" xlink:href="screenshots/desktop-gallery.jpg"/>
  <rect x="0" y="40" width="1784" height="1560" fill="url(#shade)"/>
  <rect x="1160" y="62" width="616" height="1546" rx="12" fill="#000" fill-opacity="0.6" filter="url(#lift)"/>
  <image x="1160" y="46" width="616" height="1546" xlink:href="screenshots/panel-gallery.png"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="96" y="230" fill="#ffffff" font-size="96" font-weight="700">28 looks.</text>
    <text x="96" y="334" fill="#b98cff" font-size="96" font-weight="700">One click away.</text>
    <circle cx="108" cy="466" r="9" fill="#b98cff"/><text x="142" y="480" font-size="42" font-weight="700" fill="#ffffff">Palettes</text><text x="142" y="526" font-size="31" fill="#d6dde6">14 static color schemes, Synthwave to Glacier</text><circle cx="108" cy="616" r="9" fill="#b98cff"/><text x="142" y="630" font-size="42" font-weight="700" fill="#ffffff">Motion</text><text x="142" y="676" font-size="31" fill="#d6dde6">9 animated looks, with speed control</text><circle cx="108" cy="766" r="9" fill="#b98cff"/><text x="142" y="780" font-size="42" font-weight="700" fill="#ffffff">Custom</text><text x="142" y="826" font-size="31" fill="#d6dde6">solid color, WASD + arrows, your own hex</text><circle cx="108" cy="916" r="9" fill="#b98cff"/><text x="142" y="930" font-size="42" font-weight="700" fill="#ffffff">Surprise me</text><text x="142" y="976" font-size="31" fill="#d6dde6">one button for a random look</text><circle cx="108" cy="1066" r="9" fill="#b98cff"/><text x="142" y="1080" font-size="42" font-weight="700" fill="#ffffff">Theme sync</text><text x="142" y="1126" font-size="31" fill="#d6dde6">or let Omarchy choose the colors</text>
    <text x="96" y="1566" fill="#9fb0c0" font-size="28" letter-spacing="5" font-weight="700">OMACORSAIR · OMARCHY</text>
  </g>
</svg>
