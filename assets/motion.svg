<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1784" height="1150" viewBox="0 0 1784 1150">
  <!-- Motion: Aurora with speed controls. Real DP-2 capture (3840x1600, scale 1.6); the panel sits at its real position, bullets in the free space. -->
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#070a14" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#070a14" stop-opacity="0.84"/>
      <stop offset="0.64" stop-color="#070a14" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#070a14" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-10%" width="140%" height="125%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <image x="0" y="0" width="1784" height="1150" xlink:href="screenshots/desktop-motion.jpg"/>
  <rect x="0" y="40" width="1784" height="1110" fill="url(#shade)"/>
  <rect x="1160" y="62" width="616" height="1097" rx="12" fill="#000" fill-opacity="0.6" filter="url(#lift)"/>
  <image x="1160" y="46" width="616" height="1097" xlink:href="screenshots/panel-motion.png"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="96" y="230" fill="#ffffff" font-size="96" font-weight="700">Make it move.</text>
    <text x="96" y="334" fill="#3de0a0" font-size="96" font-weight="700">Nine animations.</text>
    <circle cx="108" cy="436" r="9" fill="#3de0a0"/><text x="142" y="450" font-size="42" font-weight="700" fill="#ffffff">Aurora, Matrix rain, Hearth fire</text><text x="142" y="496" font-size="31" fill="#d6dde6">plus Nebula and Prism tide</text><circle cx="108" cy="561" r="9" fill="#3de0a0"/><text x="142" y="575" font-size="42" font-weight="700" fill="#ffffff">Comet, Silk waves, Fireflies</text><text x="142" y="621" font-size="31" fill="#d6dde6">animations that use your own colors</text><circle cx="108" cy="686" r="9" fill="#3de0a0"/><text x="142" y="700" font-size="42" font-weight="700" fill="#ffffff">Speed, your way</text><text x="142" y="746" font-size="31" fill="#d6dde6">a slider plus Dreamy / Flow / Energetic</text><circle cx="108" cy="811" r="9" fill="#3de0a0"/><text x="142" y="825" font-size="42" font-weight="700" fill="#ffffff">Preview first</text><text x="142" y="871" font-size="31" fill="#d6dde6">the mini keyboard shows the real key colors</text>
    <text x="96" y="1116" fill="#9fb0c0" font-size="28" letter-spacing="5" font-weight="700">OMACORSAIR · OMARCHY</text>
  </g>
</svg>
